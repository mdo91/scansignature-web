name: Validate SignDocs website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Check TypeScript
        run: npm run check
        working-directory: site
      - name: Build for the GitHub Pages repository path
        run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Verify the publication artifact
        run: |
          test -f site/dist/client/index.html
          test -f site/dist/client/.nojekyll
          test -f site/dist/client/mockup/main.png
          test -f site/dist/client/mockup/DownloadAppleBadge.svg
          test -d site/dist/client/_next/static
