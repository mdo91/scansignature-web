name: Validate SignDocs website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      matrix:
        base_path: ['', '/scansignature-web']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run check
        working-directory: site
      - name: Build and validate every public page
        run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
