name: Publish SignDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Check TypeScript
        run: npm run check
        working-directory: site
      - name: Build static website
        run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify the website artifact
        run: |
          test -f site/dist/client/index.html
          test -f site/dist/client/.nojekyll
          test -f site/dist/client/mockup/main.png
          test -d site/dist/client/_next/static
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('site/dist/client/index.html', 'utf8');
          for (const marker of ['id="hero-title"', 'id="features"', 'id="privacy"', 'id6805875185']) {
            if (!html.includes(marker)) throw new Error(`Missing landing page content: ${marker}`);
          }
          for (const route of ['terms', 'privacy']) {
            const legal = readFileSync(`site/dist/client/${route}/index.html`, 'utf8');
            for (const marker of ['Damas Technologies LLC', 'mailto:hi@damastechnologies.com']) {
              if (!legal.includes(marker)) throw new Error(`Missing ${route} content: ${marker}`);
            }
          }
          JS
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
